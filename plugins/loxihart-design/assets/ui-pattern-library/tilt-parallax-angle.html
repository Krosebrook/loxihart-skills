<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pattern: Tilt Parallax Angle</title>
<!--
  PATTERN: Tilt Parallax Angle
  CATEGORY: Motion & Transform Effects
  PRIORITY: Low  |  RISK: Medium

  WHAT THIS IS: a card that tilts in 3D following cursor position
  (desktop), with an optional device-orientation mode on mobile.

  ADAPT THIS BY:
    - Applying .tilt-card + the JS below to any card-shaped element.
    - Tuning MAX_TILT_DEG for a subtler/stronger effect.

  DO NOT STRIP WHEN ADAPTING:
    - rAF-gated transform writes — raw pointermove fires far more often
      than needed; computing on every event and writing on every event
      is an INP risk (Performance Budget). Compute in the handler, apply
      inside requestAnimationFrame.
    - Purely decorative + pointer-only (Tier 4): nothing functional is
      gated behind hover here, so no keyboard equivalent is required —
      it simply doesn't tilt for keyboard/switch users, which is fine.
    - The DeviceOrientationEvent permission request is behind an explicit
      button tap. iOS requires requestPermission() to be called directly
      inside a user gesture — calling it on page load or inside another
      async callback will be silently rejected by the browser.
-->
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f8fafc;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
    gap: 1rem;
    flex-direction: column;
  }
  .tilt-card {
    width: 280px; height: 180px;
    border-radius: 16px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: grid; place-items: center;
    color: white; font-weight: 700; font-size: 1.125rem;
    transform-style: preserve-3d;
    transform: perspective(600px) rotateX(0deg) rotateY(0deg);
    transition: transform 400ms cubic-bezier(0.4,0,0.2,1);
    will-change: transform;
  }
  .tilt-card.tilting { transition: none; }

  button.motion-permission {
    padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid #cbd5e1;
    background: white; cursor: pointer; font-size: 0.8125rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .tilt-card { transform: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="tilt-card" id="tiltCard" aria-hidden="true">Hover me</div>
  <button class="motion-permission" id="motionPermBtn">Enable tilt-by-tilting (mobile)</button>

  <script>
    (function () {
      'use strict';

      // Defensive: this artifact preview sandbox's console omits
      // console.assert, which is what threw on the last delivery. Shadow
      // console locally (rather than mutating the real global object,
      // which could itself fail if that object is frozen/proxied) so
      // every console.assert(...) call below keeps working unchanged.
      var console = (function (real) {
        var noop = function () {};
        var warn = typeof real.warn === 'function' ? real.warn.bind(real) : noop;
        return {
          log: typeof real.log === 'function' ? real.log.bind(real) : noop,
          warn: warn,
          error: typeof real.error === 'function' ? real.error.bind(real) : noop,
          assert: function (condition, message) { if (!condition) warn('[smoke check failed] ' + message); },
        };
      })(/** @type {any} */ (window.console || {}));
      const card = document.getElementById('tiltCard');
      const motionBtn = /** @type {HTMLButtonElement} */ (document.getElementById('motionPermBtn'));
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const MAX_TILT_DEG = 12;

      if (reduceMotion) {
        motionBtn.remove();
        return; // fully decorative, fully removable
      }

      let latest = null;
      let rafPending = false;

      function scheduleApply() {
        if (rafPending) return;
        rafPending = true;
        requestAnimationFrame(applyTilt);
      }

      function applyTilt() {
        rafPending = false;
        if (!latest) return;
        const { px, py } = latest; // 0..1 within the card
        const rotateY = (px - 0.5) * MAX_TILT_DEG * 2;
        const rotateX = (0.5 - py) * MAX_TILT_DEG * 2;
        card.style.transform = `perspective(600px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      }

      card.addEventListener('pointerenter', () => card.classList.add('tilting'));
      card.addEventListener('pointermove', (e) => {
        const rect = card.getBoundingClientRect();
        latest = { px: (e.clientX - rect.left) / rect.width, py: (e.clientY - rect.top) / rect.height };
        scheduleApply();
      });
      card.addEventListener('pointerleave', () => {
        card.classList.remove('tilting');
        latest = null;
        card.style.transform = 'perspective(600px) rotateX(0deg) rotateY(0deg)';
      });

      // Mobile device-orientation mode — explicit opt-in, gesture-gated.
      motionBtn.addEventListener('click', async () => {
        if (typeof DeviceOrientationEvent === 'undefined') {
          motionBtn.textContent = 'Device orientation not supported here';
          return;
        }
        if (typeof /** @type {any} */ (DeviceOrientationEvent).requestPermission === 'function') {
          // Must be called directly inside this click handler on iOS —
          // wrapping it in another async step will get silently denied.
          const result = await /** @type {any} */ (DeviceOrientationEvent).requestPermission();
          if (result !== 'granted') {
            motionBtn.textContent = 'Permission denied';
            return;
          }
        }
        window.addEventListener('deviceorientation', (e) => {
          const rotateY = Math.max(-MAX_TILT_DEG, Math.min(MAX_TILT_DEG, (e.gamma || 0) / 2));
          const rotateX = Math.max(-MAX_TILT_DEG, Math.min(MAX_TILT_DEG, (e.beta || 0) / 4));
          latest = null; // bypass pointer path
          card.style.transform = `perspective(600px) rotateX(${-rotateX}deg) rotateY(${rotateY}deg)`;
        });
        motionBtn.textContent = 'Tilt-by-tilting enabled';
        motionBtn.disabled = true;
      });

      // --- inline smoke test -------------------------------------------
      console.assert(getComputedStyle(card).willChange.includes('transform'),
        '[smoke] will-change hints the compositor before animation starts');
    })();
  </script>
</body>
</html>
