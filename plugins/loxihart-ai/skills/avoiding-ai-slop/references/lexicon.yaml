tier3_density:
  # Normal English that LLMs oversaturate. max = occurrences per 1000 words.
  default_max_per_1000: 2
  words:
    - {term: significant, max: 4, ok: "statistics — 'statistically significant' is exempt vocabulary"}
    - {term: significantly, max: 3}
    - {term: crucial, max: 2}
    - {term: critical, max: 4, ok: "severity levels, critical sections, critical path"}
    - {term: key, max: 4, ok: "cryptographic keys, primary keys, keyboard keys are exempt"}
    - {term: essential, max: 2}
    - {term: vital, max: 2}
    - {term: comprehensive, max: 2}
    - {term: important, max: 5}
    - {term: additionally, max: 2}
    - {term: moreover, max: 1}
    - {term: furthermore, max: 1}
    - {term: ultimately, max: 2}
    - {term: overall, max: 2}
    - {term: various, max: 3}
    - {term: numerous, max: 2}
    - {term: several, max: 5}
    - {term: effectively, max: 2}
    - {term: efficiently, max: 2}
    - {term: truly, max: 2}
    - {term: incredibly, max: 1}
    - {term: extremely, max: 2}
    - {term: highly, max: 3}
    - {term: deeply, max: 2}
    - {term: remarkable, max: 1}
    - {term: remarkably, max: 1}
    - {term: valuable, max: 2}
    - {term: enhance, max: 2}
    - {term: enhancing, max: 2}
    - {term: optimize, max: 3, ok: "compiler/query optimization — technical senses lean exempt"}
    - {term: facilitate, max: 1}
    - {term: ensure, max: 4, ok: "legit in specs and SLAs; watch marketing use"}
    - {term: enable, max: 4, ok: "feature flags, config enablement exempt"}
    - {term: innovative, max: 1}
    - {term: actionable, max: 2}
    - {term: impactful, max: 1}
    - {term: ecosystem, max: 2, ok: "biology exempt"}
    - {term: framework, max: 4, ok: "software frameworks exempt when named (React, .NET)"}
    - {term: roadmap, max: 3, ok: "actual planning artifacts exempt"}
    - {term: momentum, max: 2, ok: "physics exempt"}
    - {term: trajectory, max: 2, ok: "physics/ballistics exempt"}
  phrases:
