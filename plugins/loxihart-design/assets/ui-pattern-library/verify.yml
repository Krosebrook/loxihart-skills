name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: verify
        run: npm install

      - name: Install browsers
        working-directory: verify
        run: npx playwright install --with-deps chromium firefox webkit

      # Type-check catches what neither static analysis nor browser
      # testing can — e.g. setProperty(number), which browsers coerce.
      - name: Type-check inline scripts
        working-directory: verify
        run: npm run typecheck

      # Multi-engine + computed a11y tree + axe-core + visual sanity.
      - name: Engines, accessibility, visual
        working-directory: verify
        run: npm run engines

      - name: Behavioural (6 patterns, deep)
        working-directory: verify
        run: npm run behavior

      - name: Behavioural (remaining 26)
        working-directory: verify
        run: npm run behavior:all

      # The suites are only worth their green if they can go red.
      # Visual baselines are Chromium-recorded and captured under
      # prefers-reduced-motion, so this also regression-tests the
      # reduced-motion guarantee every pattern claims.
      - name: Visual regression
        working-directory: verify
        run: npm run visual

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: verify/diffs/
          if-no-files-found: ignore

      - name: Mutation-test the harness
        working-directory: verify
        run: npm run mutation

      - name: Mutation-test the phase-2 suite
        working-directory: verify
        run: npm run mutation:phase2

      - name: Mutation-test the visual suite
        working-directory: verify
        run: npm run mutation:visual

  # A second job that installs from scratch in a different directory.
  # The suites once hardcoded absolute paths and passed locally anyway;
  # this is the check that would have caught it.
  cleanroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy to an unrelated path
        run: cp -r source /tmp/cleanroom
      - name: Install from nothing
        working-directory: /tmp/cleanroom/verify
        run: npm install
      - name: Install browsers
        working-directory: /tmp/cleanroom/verify
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Every suite, from a foreign directory
        working-directory: /tmp/cleanroom/verify
        run: npm run all
