    - {term: robust, ok: "engineering (fault tolerance), statistics (robust estimator)"}
    - {term: landscape, ok: "literal terrain; landscape orientation"}
    - {term: navigate, ok: "literal navigation, UI navigation"}
    - {term: journey, ok: "literal travel; 'user journey' as a named UX artifact"}
    - {term: seamless, ok: "literal seams (textiles, welds); rarely earned in UX claims"}
    - {term: streamline, ok: "literal fluid dynamics"}
    - {term: elevate, ok: "literal elevation; medical (elevate the limb)"}
    - {term: empower, ok: "access-control grants, legal empowerment"}
    - {term: harness, ok: "literal harness (safety, animal)"}
    - {term: unlock, ok: "literal locks, feature flags, achievement systems"}
    - {term: foster, ok: "foster care"}
    - {term: dynamic, ok: "dynamic typing/linking/programming — technical senses"}
    - {term: disruptive, ok: "clinical/behavioral sense; Christensen citation with source"}
    - {term: cutting-edge, ok: "almost never; quote from a source only"}
    - {term: state-of-the-art, ok: "ML papers with benchmark evidence (SOTA)"}
    - {term: notably, ok: "sparingly, mid-sentence, for a genuine standout fact"}
    - {term: arguably, ok: "when you then actually make the argument"}
    - {term: albeit, ok: "occasional formal register"}
    - {term: stark, ok: "genuine sharp contrast, data-backed"}
