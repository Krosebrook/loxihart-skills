# anti-slop lexicon.yaml — literal words & phrases, tiered
# Matching: case-insensitive whole-word/phrase boundary match (\b...\b).
# Morphology: scanner matches the exact form listed; list the lemma and common
#   inflections are covered by the morphology_note policy below (v0.1 scanner is
#   exact-form; the SKILL.md prose ban covers "any variation — plural, tense,
#   -ing, -ly, hyphenated").
# A term appears in EXACTLY ONE tier (slopcheck --self-test enforces this).
# Structural constructions ("it's not X, it's Y", tails, etc.) live in patterns.yaml,
#   so some pattern/lexicon overlap in scan reports is expected and fine.

meta:
  name: anti-slop-lexicon
  version: 0.2.0
  generated: "2026-07-19"
  register_calibration: >
    Tiering is calibrated for a technical / MSP-consulting register. Words that
    are working vocabulary in engineering, stats, or MSP delivery (robust,
    significant, end-to-end, turnkey, roadmap, framework) are deliberately
    Tier 2/3, never Tier 1. Recalibrate tiers before reusing for pure
    marketing or fiction registers.
  tier_semantics:
    tier1_ban: "Rewrite on sight in prose. Near-zero legitimate cost in this register."
    tier2_flag: "Context-dependent. Legitimate literal/technical uses exist — human judgment. `ok:` notes the legit context."
    tier3_density: "Normal English that LLMs oversaturate. Count per 1000 words; breach = revise."
  morphology_note: >
    Ban covers singular/plural, tenses, -ing/-ed/-ly forms, e-drop, y-to-ies,
    and space/hyphen variants of compounds. Enforced in code by
    scripts/slopcheck.py lemma_regex (suffix heuristic; -ness/-ation/-istic
    variants are out of scope and listed separately where they matter).

