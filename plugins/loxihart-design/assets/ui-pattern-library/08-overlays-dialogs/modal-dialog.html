<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pattern: Modal Dialog</title>
<!--
  PATTERN: Modal Dialog
  CATEGORY: Overlays & Dialogs
  PRIORITY: High  |  RISK: High

  WHAT THIS IS: a modal dialog built on the native <dialog> element with
  showModal(), which is the correct default in 2026.

  ADAPT THIS BY:
    - Replacing the dialog body. The open/close/focus wiring is generic.

  DO NOT STRIP WHEN ADAPTING — and read this before hand-rolling a modal:
    - showModal() gives you, for free and correctly: focus trapping, the
      inert backdrop, Escape-to-close, top-layer stacking above any
      z-index, and aria-modal semantics. A hand-rolled div+role="dialog"
      has to reimplement all of it, and the focus trap in particular is
      almost always subtly wrong (it usually misses shadow DOM, iframes,
      and dynamically-added focusables). Use the platform.
    - FOCUS RETURN on close. Native <dialog> already restores focus to the
      invoker in Chromium, Firefox and WebKit, so the explicit call here is
      belt-and-braces, NOT load-bearing. Measured honestly: deleting it
      regressed nothing, and focus() on a detached node is a silent no-op in
      all three engines rather than a throw. An earlier version of this
      comment claimed the guard prevented a crash — it does not. It is kept
      because it makes the intent explicit and survives being ported to a
      framework that renders its own overlay instead of using <dialog>,
      where the platform behaviour is not there to fall back on.
    - The `cancel` event fires on Escape. Do not preventDefault it unless
      you are deliberately blocking dismissal AND providing another way
      out — a modal you cannot escape is a keyboard trap (WCAG 2.1.2).
    - Set the initial focus deliberately. Native behaviour focuses the
      first focusable element, which is often a close button — landing a
      screen-reader user on "Close" tells them nothing about the dialog.
      This focuses the heading (tabindex="-1") so the purpose is announced.
    - Clicking the backdrop closes here. That is a convention, not a
      requirement — for destructive confirmations, remove it so a stray
      click cannot dismiss the decision.
-->
<style>
  :root { --accent: #2563eb; --border: #cbd5e1; --dur: 180ms; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f8fafc; color: #0f172a;
    display: grid; place-items: center; min-height: 100vh; margin: 0;
  }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; min-height: 44px;
    padding: 0.6rem 1.1rem; border: 1px solid var(--border); background: #fff;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

  dialog {
    border: none; border-radius: 14px; padding: 0;
    max-width: min(460px, calc(100vw - 2rem));
    box-shadow: 0 24px 48px -12px rgba(15,23,42,0.35);
  }
  dialog::backdrop { background: rgba(15, 23, 42, 0.55); }
  dialog[open] { animation: dlg-in var(--dur) cubic-bezier(0.16,1,0.3,1); }
  dialog[open]::backdrop { animation: fade-in var(--dur) ease; }
  @keyframes dlg-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
  @keyframes fade-in { from { opacity: 0; } }

  .dlg-head { padding: 1.25rem 1.25rem 0; }
  .dlg-head h2 { margin: 0; font-size: 1.125rem; }
  .dlg-head h2:focus { outline: none; }
  .dlg-body { padding: 0.75rem 1.25rem 1.25rem; font-size: 0.9375rem; line-height: 1.6; color: #334155; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 0.5rem; padding: 0 1.25rem 1.25rem; }

  @media (prefers-reduced-motion: reduce) {
    dialog[open], dialog[open]::backdrop { animation: none; }
  }
</style>
</head>
<body>
  <div>
    <button class="btn-primary" id="openBtn">Edit profile</button>
    <p id="result" role="status" aria-live="polite"
       style="font-size:0.875rem;color:#475569;min-height:1.2em;margin-top:1rem"></p>
  </div>

  <dialog id="dlg" aria-labelledby="dlgTitle">
    <div class="dlg-head">
      <h2 id="dlgTitle" tabindex="-1">Edit profile</h2>
    </div>
    <div class="dlg-body">
      <p>Focus is trapped inside this dialog by the platform, not by JavaScript.
         Tab cycles the buttons below; Escape closes and returns focus to the
         button that opened it.</p>
    </div>
    <div class="dlg-foot">
      <button id="cancelBtn">Cancel</button>
      <button class="btn-primary" id="saveBtn">Save changes</button>
    </div>
  </dialog>

  <script>
    (function () {
      'use strict';

      var console = (function (real) {
        var noop = function () {};
        var warn = typeof real.warn === 'function' ? real.warn.bind(real) : noop;
        return {
          log: typeof real.log === 'function' ? real.log.bind(real) : noop,
          warn: warn,
          error: typeof real.error === 'function' ? real.error.bind(real) : noop,
          assert: function (condition, message) { if (!condition) warn('[smoke check failed] ' + message); },
        };
      })(/** @type {any} */ (window.console || {}));

      const dlg = /** @type {HTMLDialogElement} */ (document.getElementById('dlg'));
      const openBtn = /** @type {HTMLButtonElement} */ (document.getElementById('openBtn'));
      const cancelBtn = /** @type {HTMLButtonElement} */ (document.getElementById('cancelBtn'));
      const saveBtn = /** @type {HTMLButtonElement} */ (document.getElementById('saveBtn'));
      const title = /** @type {HTMLElement} */ (document.getElementById('dlgTitle'));
      const result = /** @type {HTMLElement} */ (document.getElementById('result'));

      /** @type {HTMLElement|null} */
      let invoker = null;

      function open() {
        invoker = /** @type {HTMLElement} */ (document.activeElement);
        dlg.showModal();
        // Focus the heading rather than the first button, so the dialog's
        // purpose is what gets announced.
        title.focus();
      }

      function close(reason) {
        if (dlg.open) dlg.close(reason || '');
      }

      // Single place to handle focus return, so every close path — button,
      // Escape, backdrop — goes through it.
      dlg.addEventListener('close', () => {
        result.textContent = dlg.returnValue === 'save'
          ? 'Changes saved' : 'Dialog dismissed';
        if (invoker && document.contains(invoker)) invoker.focus();
        invoker = null;
      });

      openBtn.addEventListener('click', open);
      cancelBtn.addEventListener('click', () => close('cancel'));
      saveBtn.addEventListener('click', () => close('save'));

      // Backdrop click. The dialog element fills only its own box, so a
      // click landing on <dialog> itself is a click on the backdrop.
      dlg.addEventListener('click', (e) => {
        if (e.target === dlg) close('dismiss');
      });

      // --- inline smoke test -------------------------------------------
      console.assert(dlg.tagName === 'DIALOG',
        '[smoke] native <dialog>: focus trap, inert backdrop and top-layer come from the platform');
      console.assert(typeof dlg.showModal === 'function',
        '[smoke] showModal is available (modal semantics, not just a styled box)');
      console.assert(dlg.getAttribute('aria-labelledby') === 'dlgTitle',
        '[smoke] dialog is labelled by its heading');
      console.assert(title.tabIndex === -1,
        '[smoke] heading is programmatically focusable so the purpose is announced first');
      console.assert(!dlg.open, '[smoke] dialog starts closed');
    })();
  </script>
</body>
</html>
