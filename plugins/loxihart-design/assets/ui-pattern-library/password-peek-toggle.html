<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pattern: Password Peek Toggle</title>
<!--
  PATTERN: Password Peek Toggle
  CATEGORY: Action Feedback & Confirmation
  PRIORITY: High  |  RISK: Low

  WHAT THIS IS: an icon button inside a password field that toggles
  masked/plaintext visibility.

  ADAPT THIS BY:
    - Reusing togglePeek() as-is; it's field-agnostic (works on any
      input[type=password] + adjacent toggle button pair).

  DO NOT STRIP WHEN ADAPTING (production detail most implementations skip):
    - Caret/selection preservation across the type="password"<->"text"
      switch. Some browsers reset cursor position when input.type changes;
      this restores selectionStart/selectionEnd immediately after.
    - aria-pressed on the toggle button reflecting actual state, and
      aria-label changing between "Show password" / "Hide password" —
      not just an icon swap with no text equivalent.
    - autocomplete="current-password" stays set regardless of visibility
      state; don't touch it when toggling.
    - No paste-blocking, no restrictions on the field beyond visibility —
      that's a real anti-pattern this file deliberately does NOT implement.

  NOTE: no prefers-reduced-motion query in this file, deliberately — the
  type/plaintext toggle has zero CSS transition or animation attached to
  it, so there's nothing for that media query to gate.
-->
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f8fafc;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .field {
    position: relative;
    display: flex; flex-direction: column; gap: 0.375rem;
    width: 280px;
  }
  label { font-size: 0.8125rem; font-weight: 600; color: #334155; }
  .input-row { position: relative; }
  input[type="password"], input[type="text"].pw-input {
    width: 100%; box-sizing: border-box;
    padding: 0.6rem 2.5rem 0.6rem 0.75rem;
    border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9375rem;
  }
  input:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
  button.peek-toggle {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border: none; background: transparent;
    border-radius: 6px; cursor: pointer; display: grid; place-items: center;
    color: #475569;
  }
  button.peek-toggle:hover { background: #f1f5f9; }
  button.peek-toggle:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
</style>
</head>
<body>
  <div class="field">
    <label for="pw">Password</label>
    <div class="input-row">
      <input type="password" id="pw" autocomplete="current-password" value="correct-horse-battery" />
      <button class="peek-toggle" id="peekToggle" type="button" aria-pressed="false" aria-label="Show password">
        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // Defensive: this artifact preview sandbox's console omits
      // console.assert, which is what threw on the last delivery. Shadow
      // console locally (rather than mutating the real global object,
      // which could itself fail if that object is frozen/proxied) so
      // every console.assert(...) call below keeps working unchanged.
      var console = (function (real) {
        var noop = function () {};
        var warn = typeof real.warn === 'function' ? real.warn.bind(real) : noop;
        return {
          log: typeof real.log === 'function' ? real.log.bind(real) : noop,
          warn: warn,
          error: typeof real.error === 'function' ? real.error.bind(real) : noop,
          assert: function (condition, message) { if (!condition) warn('[smoke check failed] ' + message); },
        };
      })(/** @type {any} */ (window.console || {}));
      const pw = /** @type {HTMLInputElement} */ (document.getElementById('pw'));
      const toggle = document.getElementById('peekToggle');
      const eyeIcon = document.getElementById('eyeIcon');

      const eyeOpen = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
      const eyeClosed = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 4.22-5.06M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/>';

      // CARET PRESERVATION — what actually breaks, measured not assumed:
      //
      // Commonly-repeated claim: "changing input.type resets the caret, so
      // save and restore selectionStart." Measured in Chromium, that is
      // FALSE — a password->text swap preserves selectionStart exactly.
      //
      // What actually loses the caret is the ACTIVATION, not the type swap.
      // Clicking the toggle blurs the input, and the selection reads back as
      // 0 once focus has left. A save/restore written inside the click
      // handler therefore saves a 0 and faithfully restores that 0.
      //
      // (An earlier attempt at this fix also tracked selection on `blur` —
      // which made it worse, since blur is exactly when the value is already
      // clobbered, so it overwrote the good value with 0.)
      //
      // Two fixes together:
      //   1. Capture at POINTERDOWN on the toggle — the last moment the input
      //      still holds a valid selection.
      //   2. preventDefault there too, so pointer activation never moves
      //      focus off the field at all. Keyboard activation (Enter/Space
      //      fires click, not pointerdown) is unaffected.
      let lastSelection = { start: null, end: null };

      function rememberSelection() {
        // Only trust a reading while the input actually has focus.
        if (document.activeElement === pw && pw.selectionStart !== null) {
          lastSelection = { start: pw.selectionStart, end: pw.selectionEnd };
        }
      }
      ['keyup', 'click', 'select'].forEach((evt) =>
        pw.addEventListener(evt, rememberSelection)
      );

      toggle.addEventListener('pointerdown', (e) => {
        rememberSelection();  // capture BEFORE focus can shift
        e.preventDefault();   // and try to stop it shifting at all
      });

      function togglePeek() {
        const showing = pw.type === 'text';
        rememberSelection(); // capture current if the input still has it

        pw.type = showing ? 'password' : 'text';

        const { start, end } = lastSelection;
        // Restore on the NEXT FRAME, not synchronously.
        //
        // Measured, not assumed: a synchronous setSelectionRange() here does
        // run with the correct value (verified by instrumenting the call and
        // its stack), and the caret is STILL 0 immediately afterward — the
        // browser's own post-activation focus/selection reconciliation lands
        // after the click handler returns and overwrites it. Deferring one
        // frame puts the restore after that reconciliation instead of before.
        if (start !== null) {
          requestAnimationFrame(() => {
            pw.focus();
            pw.setSelectionRange(start, end);
          });
        }

        const nowShowing = !showing;
        toggle.setAttribute('aria-pressed', String(nowShowing));
        toggle.setAttribute('aria-label', nowShowing ? 'Hide password' : 'Show password');
        eyeIcon.innerHTML = nowShowing ? eyeClosed : eyeOpen;
      }

      toggle.addEventListener('click', togglePeek);

      // --- inline smoke test -------------------------------------------
      console.assert(pw.getAttribute('autocomplete') === 'current-password',
        '[smoke] autocomplete hint present for password managers');
      console.assert(toggle.getAttribute('aria-pressed') === 'false',
        '[smoke] toggle exposes its boolean state via aria-pressed');
    })();
  </script>
</body>
</html>
